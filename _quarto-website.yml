project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "chapters/*.qmd"
    - "!README.md"
    - "!appendix-document-metadata.qmd"
    - "!references.qmd"
    # The `latex-macros` git submodule provides macro definitions for include/
    # shortcode use, not standalone site pages. Don't render its .qmd files
    # directly: macros-table.qmd uses DT::datatable() (an HTML widget) that
    # errors when the project also renders to PDF.
    - "!latex-macros/"
    - "!ids/"

website:
  title: "Information Theory for Data Science"
  site-url: https://morrison-lab.github.io/ids/
  description: "Information theory for data science courses"
  # https://quarto.org/docs/websites/website-llms.html --- use `llms-txt:`, not `llms:` (schema error)
  llms-txt: true
  page-footer:
    center: "Built with [Quarto](https://quarto.org/)"
  back-to-top-navigation: true
  page-navigation: true
  reader-mode: true
  repo-url: https://github.com/Morrison-Lab/ids
  repo-actions: [edit, issue, source]
  navbar:
    # Add a `left:` list of menus here that mirrors the sidebar's `contents`
    # one-for-one (same groups, same names, same order, same pages), as pds
    # does, once the first topic pages exist. The site title (which links
    # home), search, and the GitHub link round out the navbar.
    search: true
    right:
      - icon: github
        href: https://github.com/Morrison-Lab/ids
        aria-label: GitHub
  sidebar:
    # Topic pages in reading order, grouped into sections, each group
    # depending only on earlier ones; the navbar's `left` menus mirror it.
    # There is no Home entry: the navbar title already links to the home page.
    style: docked
    search: false
    contents: []

callouty-theorem:
  thm:
    override-title: false # do not have the filter set
                          # or override a callout title
    callout: # parameters of the wrapping callout
             # see Quarto callout docs for details
      type: lem  # same color as lem (royal blue); color set in custom-callout block below
      appearance: minimal
  lem:
    override-title: false
    callout:
      type: lem
      appearance: minimal
  cor:
    override-title: false
    callout:
      type: cor
      appearance: minimal
  prp:
    override-title: false
    callout:
      type: prp
      appearance: minimal
  cnj:
    override-title: false
    callout:
      type: cnj
      appearance: minimal
  def:
    override-title: false
    callout:
      type: def
      appearance: minimal
  exm:
    override-title: false
    callout:
      type: exm
      appearance: minimal
  exr:
    override-title: false
    callout:
      type: exr
      appearance: minimal
  proof: # also support wrapping proof-like environments
    override-title: true # override the callout title with
                         # the proof-type label,
                         # appending the element name when provided
    callout:
      type: proof
      appearance: default
      collapse: true
      icon: true
  solution:
    override-title: true
    callout:
      type: solution
      appearance: default
      collapse: true
      icon: false
  remark:
    override-title: false
    callout:
      type: remark
      appearance: minimal

# Color palette for theorem/proof environments.
# The coatless-quarto/custom-callout extension reads this block and injects
# CSS (HTML) and LaTeX \definecolor (PDF) so each type gets a unique color.
# Rules: no reds; thm shares lem's royal blue.
custom-callout:
  lem:
    color: "#1565C0"  # royal blue (also used for thm)
  cor:
    color: "#00838F"  # dark cyan
  prp:
    color: "#827717"  # dark olive
  cnj:
    color: "#558B2F"  # grass green
  def:
    color: "#1B5E20"  # forest green (very distinct from theorem types)
  exm:
    color: "#6A1B9A"  # deep purple
  exr:
    color: "#FFA500"  # orange
  proof:
    color: "#37474F"  # blue-grey slate
  solution:
    color: "#4E342E"  # dark cocoa
  remark:
    color: "#AD1457"  # dark magenta

format:
  html:
    filters:
      - sun123zxy/callouty-theorem
      - coatless-quarto/custom-callout
    theme:
      light: [cosmo, offwhite.scss]
      dark: darkly
    # Replaces Quarto's two-way toggle with a Light / Off-white / Parchment / Dark dropdown.
    include-in-header: theme-picker.html
    css: styles.css
    toc: true
    anchor-sections: true
    toc-location: right
    toc-depth: 3
    code-fold: true
    code-tools: true
    code-link: true
    code-summary: "Show code"
    highlight-style: arrow
    lightbox: true
    link-external-icon: true
    embed-resources: false
    fig-cap-location: top
    html-math-method: mathjax
    number-sections: true
    number-depth: 3
    df-print: paged
  docx:
    number-sections: true
    number-depth: 3
    df-print: tibble
    prefer-html: true
  revealjs:
    output-file: "{stem}-slides.html"
    theme: [simple, styles-reveal.scss]
    include-in-header: qwt-reveal-toggle.html
    slide-number: true
    chalkboard: false
    preview-links: auto
    controls: true
    transition: slide
    background-transition: fade
    lightbox: true
    fig-cap-location: top
    html-math-method: mathjax
    number-sections: true
    progress: true
    incremental: false
    df-print: paged
    number-depth: 2
    shift-heading-level-by: 0
    slide-level: 2
    scrollable: true
    echo: true
    margin: 0.0
    code-fold: true
    code-link: true
    code-summary: "[Code]"
    auto-stretch: true
    fig-height: 5
    fig-width: 7

date: last-modified
date-format: "[Last modified:] YYYY-MM-DD HH:mm:ss (z)"

execute:
  warning: false
  message: false
  cache: false
  freeze: auto

knitr:
  opts_chunk:
    collapse: true
    comment: "#>"
