# Fails when a display equation has no {#eq-...} label.
# The equation-anchors filter gives a permalink only to a labeled equation,
# and the lab labels every display equation so it gets a number and a URL.
# Every equation here is labeled, so the shared check scans the whole tree
# rather than only a PR's added lines.
# Put a label after the closing $$, such as $$ ... $$ {#eq-kraft-inequality},
# or add <!-- check-equation-labels: allow: reason --> on the line before it.
name: Check Equation Labels

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  check:
    permissions:
      contents: read
    uses: Morrison-Lab/gha/.github/workflows/check-equation-labels.yml@v3
    with:
      whole-tree: true
